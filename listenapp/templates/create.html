{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2 class="mt-3">Create New Entry</h2>
    <div class="form-group">
        <form method="post">
            {% csrf_token %}
            <div class="form-floating mb-3">
                {{ form.title }}
                <label for="{{form.title.id_for_label}}">Title</label>

            </div>
            <div class="mb-3">
                <label class="form-label">Entry</label>
                {{ form.text }}
            </div>
            <div class="form-check form-switch mb-3">
                {{ form.public }}
                <label class="form-check-label" for="{{ form.public.id_for_label }}">Would you like to make this post
                    public?</label>
            </div>
            <button type="button" class="btn btn-outline-secondary" id="optional">Optional Parameters</button>

            <div class="form-check form-switch mt-1" id="use_instrumentalness" style="display: none;">
                {{ form.use_instrumentalness }}
                <label class="form-check-label" for="{{ form.use_instrumentalness.id_for_label }}">Choose
                    Instrumentalness?</label>
            </div>
            <div id="inst_slider_div" style="display: none;">
                <label class="form-label">Instrumentalness:
                    <span id="instrumental_val">0.5</span>
                </label>
                {{ form.instrumentalness }}
            </div>
            <div class="form-check form-switch mt-1" id="use_popularity" style="display: none;">
                {{ form.use_popularity }}
                <label class="form-check-label" for="{{ form.use_popularity.id_for_label }}">Choose Popularity?</label>
            </div>
            <div id="popularity_slider_div" style="display: none;">
                <label class="form-label">Popularity:
                    <span id="popularity_val">0.5</span>
                </label>
                {{ form.popularity }}
            </div>
            <div class="form-check form-switch mt-1" id="use_liveness" style="display: none;">
                {{ form.use_liveness }}
                <label class="form-check-label" for="{{ form.use_live.id_for_label }}">Choose Liveness?</label>
            </div>
            <div id="live_slider_div" style="display: none;">
                <label class="form-label">liveness:
                    <span id="liveness_val">0.5</span>
                </label>
                {{ form.liveness }}
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("optional");
        const inst_switch = document.getElementById("use_instrumentalness");
        const inst_switch_input = inst_switch.querySelector("input[type='checkbox']");
        const inst_slider_div = document.getElementById("inst_slider_div");
        const pop_switch = document.getElementById("use_popularity");
        const pop_switch_input = pop_switch.querySelector("input[type='checkbox']");
        const pop_slider_div = document.getElementById("popularity_slider_div");
        const live_switch = document.getElementById("use_liveness");
        const live_switch_input = live_switch.querySelector("input[type='checkbox']");
        const live_slider_div = document.getElementById("live_slider_div");
        btn.addEventListener("click", () => {
            inst_switch.style.display = inst_switch.style.display === "none" ? "block" : "none";
            pop_switch.style.display = pop_switch.style.display === "none" ? "block" : "none";
            live_switch.style.display = live_switch.style.display === "none" ? "block" : "none";
            if (inst_switch.style.display === "none") {
                inst_slider_div.style.display = "none";
                inst_switch_input.checked = false;
            }
            if (pop_switch.style.display === "none") {
                pop_slider_div.style.display = "none";
                pop_switch_input.checked = false;
            }
            if (live_switch.style.display === "none") {
                live_slider_div.style.display = "none";
                live_switch_input.checked = false;
            }
        });
        inst_switch_input.addEventListener("change", () => {
            inst_slider_div.style.display = inst_switch_input.checked ? "block" : "none";
        });
        pop_switch_input.addEventListener("change", () => {
            pop_slider_div.style.display = pop_switch_input.checked ? "block" : "none";
        });
        live_switch_input.addEventListener("change", () => {
            live_slider_div.style.display = live_switch_input.checked ? "block" : "none";
        });
        const inst_slider = document.querySelector('input[name="instrumentalness"]');
        const inst_label = document.getElementById("instrumental_val");
        const pop_slider = document.querySelector('input[name="popularity"]');
        const pop_label = document.getElementById("popularity_val");
        const live_slider = document.querySelector('input[name="liveness"]');
        const live_label = document.getElementById("liveness_val");
        if (inst_slider) {
            inst_label.textContent = inst_slider.value;
            inst_slider.addEventListener("input", () => {
                inst_label.textContent = inst_slider.value;
            });
        }
        if (pop_slider) {
            pop_label.textContent = pop_slider.value;
            pop_slider.addEventListener("input", () => {
                pop_label.textContent = pop_slider.value;
            });
        }
        if (live_slider) {
            live_label.textContent = live_slider.value;
            live_slider.addEventListener("input", () => {
                live_label.textContent = live_slider.value;
            });
        }
    });
</script>
{% endblock %}
