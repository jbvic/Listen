<!doctype html>
<html lang="en">
{% load static %}
<style>
  .navbar-logo {
    max-height: 40px;
    height: auto;
    width: auto;
  }

    {
    % if user.is_authenticated %
  }

  .entry,
  .comment {
    background: linear-gradient(to bottom right, {
        {
        user.profile.background_color
      }
    }

    , white);

  color: {
      {
      user.profile.text_color
    }
  }

  ;
  }

  .entry *,
  .comment * {
    font-family: {
        {
        user.profile.font
      }
    }

    ;

    color: {
        {
        user.profile.text_color
      }
    }

    ;
    text-shadow: 0 0 1px rgba(0, 0, 0, 0.5);

  }

    {
    % endif %
  }
  }
</style>

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <title>Listen</title>
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-success navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{%  url 'home' %}"><img src="{% static 'logo.png' %}" alt="Listen"
          class="navbar-logo"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mynavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{%  url 'discovery' %}">Discover</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{%  url 'entries' %}">Your Entries</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{%  url 'create' %}">Create Entry</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{%  url 'settings' %}">Settings</a>
          </li>
          <li class="nav-item">
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-flex">
              {% csrf_token %}
              <button class="btn btn-secondary" type="submit">Logout</button>
            </form>
            {% else %}
            <a class="nav-link btn btn-secondary" href="{% url  'social:begin' 'spotify' %}">Login</a>
            {% endif %}
          </li>
        </ul>
      </div>
    </div>
  </nav>
  {% block content %}

  {% endblock %}

  <!--  JavaScript -->

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
